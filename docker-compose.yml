name: vending-machine-case

services:
  vending-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vending
      POSTGRES_USER: ${VENDING_MACHINE_DB_USERNAME:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${VENDING_MACHINE_DB_PASSWORD:?Copy .env.example to .env}
    volumes:
      - vending-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  vending-machine-service:
    image: vending-machine-service:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      VENDING_MACHINE_DB_URL: jdbc:postgresql://vending-db:5432/vending
      VENDING_MACHINE_DB_USERNAME: ${VENDING_MACHINE_DB_USERNAME:?Copy .env.example to .env}
      VENDING_MACHINE_DB_PASSWORD: ${VENDING_MACHINE_DB_PASSWORD:?Copy .env.example to .env}
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/demo
    ports:
      - "${VENDING_MACHINE_PORT:-8080}:8080"
    depends_on:
      vending-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  vending-db-data:
