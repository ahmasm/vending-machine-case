spring:
  application:
    name: vending-machine-service
  datasource:
    url: ${VENDING_MACHINE_DB_URL}
    username: ${VENDING_MACHINE_DB_USERNAME}
    password: ${VENDING_MACHINE_DB_PASSWORD}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  task:
    scheduling:
      pool:
        size: 2
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${VENDING_MACHINE_PORT:8080}
  shutdown: graceful

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

vending:
  session-expiry:
    enabled: ${VENDING_SESSION_EXPIRY_ENABLED:true}
    inactivity-timeout: ${VENDING_SESSION_EXPIRY_INACTIVITY_TIMEOUT:2m}
    scan-interval: ${VENDING_SESSION_EXPIRY_SCAN_INTERVAL:10s}
    initial-delay: ${VENDING_SESSION_EXPIRY_INITIAL_DELAY:10s}
    batch-size: ${VENDING_SESSION_EXPIRY_BATCH_SIZE:100}
