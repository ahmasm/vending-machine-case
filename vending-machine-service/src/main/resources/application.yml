spring:
  application:
    name: vending-machine-service
  datasource:
    url: ${VENDING_MACHINE_DB_URL}
    username: ${VENDING_MACHINE_DB_USERNAME}
    password: ${VENDING_MACHINE_DB_PASSWORD}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${VENDING_MACHINE_PORT:8080}
  shutdown: graceful

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
